<header class="site-header">
  <div class="container site-header__inner">
    <a class="site-logo" href="index.html" aria-label="{{ site.person }}, {{ site.logoTagline }}. Home">
      <img src="assets/images/logo.webp" width="900" height="442" alt="{{ site.person }}, {{ site.logoTagline }}" decoding="async">
    </a>

    <nav class="site-nav" aria-label="Main">
      {{#each nav}}<a class="site-nav__link" href="{{ this.href }}"{{#if this.active}} aria-current="page"{{/if}}>{{ this.label }}</a>
      {{/each}}<a class="site-nav__icon" href="{{ site.instagramUrl }}" target="_blank" rel="noopener" aria-label="Instagram, @{{ site.contact.instagramHandle }}">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r=".6" fill="currentColor"/></svg>
      </a>
      <a class="btn btn--sm" href="{{ site.whatsappUrl }}" target="_blank" rel="noopener">Free call</a>
    </nav>

    <details class="nav-menu">
      <summary class="nav-menu__toggle" aria-label="Menu">
        <svg class="icon-open" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 8h16M4 16h16"/></svg>
        <svg class="icon-close" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </summary>
      <nav class="nav-menu__panel" aria-label="Mobile">
        {{#each nav}}<a class="nav-menu__link" href="{{ this.href }}"{{#if this.active}} aria-current="page"{{/if}}>{{ this.label }}</a>
        {{/each}}<a class="btn nav-menu__cta" href="{{ site.whatsappUrl }}" target="_blank" rel="noopener">Book a free 15-minute call</a>
      </nav>
    </details>
  </div>
</header>
