<section class="section" aria-labelledby="call-band-title">
  <div class="container">
    <div class="panel panel--round">
      <div class="split split--center">
        <div class="call-band__media">
          <div class="arch">
            <img src="assets/images/gold-sunburst.webp" width="736" height="983" alt="A gold sunburst pressed into warm paper" loading="lazy" decoding="async">
          </div>
        </div>
        <div class="call-band__body">
          <div class="divider divider--start" aria-hidden="true"><span class="divider__dot"></span></div>
          <h2 class="call-band__title" id="call-band-title">Not sure I'm the right fit? Let's have a free fifteen-minute video call.</h2>
          <div class="call-band__actions">
            <a class="btn" href="{{ site.whatsappUrl }}" target="_blank" rel="noopener">Book your free call</a>
            <img class="call-band__bird" src="assets/images/hummingbird.webp" width="300" height="234" alt="" loading="lazy" decoding="async">
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
